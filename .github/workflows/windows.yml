name: WaveWeft Windows qualification
on:
  workflow_dispatch:
  push:
    branches: [codex/wavequay]
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          submodules: recursive
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: google/googletest
          ref: 063de7e9578f82b369302001269680b4b1553359
          path: .ci-googletest
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12.10'
      - uses: jurplel/install-qt-action/action@d325aaf2a8baeeda41ad0b5d39f84a6af9bcf005
        with:
          version: '6.11.2'
          arch: win64_msvc2022_64
          aqtsource: git+https://github.com/miurahr/aqtinstall.git@16db45a70b5905ad596941b223469bc86a56901e
          modules: qt5compat qtnetworkauth qtshadertools qtwebsockets qtgraphs qtquick3d qtscxml
          extra: --keep --archive-dest ${{ github.workspace }}/.qt-archives
          cache: false
      - uses: ilammy/msvc-dev-cmd@cec98b9d092141f74527d0afa6feb2af698cfe89
        with:
          arch: x64
      - name: Qualify offline native app and recipes
        shell: pwsh
        run: ./distribution/qualify-windows.ps1
      - name: Preserve metadata, UI trees, screenshots and diagnostics (no native binaries)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: WaveWeft-Windows-qualification
          path: |
            build-evidence/*.json
            build-evidence/*.txt
            build-evidence/*.xml
            build-evidence/gui/*.json
            build-evidence/gui/*.png
            build-evidence/gui/*.log
            build-evidence/gui-helper/*.json
            build-evidence/gui-helper/*.log
            build/CMakeCache.txt
            build/CMakeFiles/CMakeConfigureLog.yaml
            build-recipe-tests/Testing/Temporary/LastTest.log
          retention-days: 14
          if-no-files-found: warn
